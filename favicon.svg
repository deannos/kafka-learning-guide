<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#050508"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
  </defs>
  <!-- Central broker node -->
  <circle cx="16" cy="16" r="4" fill="url(#g)"/>
  <!-- Producer nodes (left) -->
  <circle cx="7" cy="9" r="2.5" fill="url(#g)" opacity="0.75"/>
  <circle cx="7" cy="23" r="2.5" fill="url(#g)" opacity="0.75"/>
  <!-- Consumer nodes (right) -->
  <circle cx="25" cy="9" r="2.5" fill="url(#g)" opacity="0.75"/>
  <circle cx="25" cy="23" r="2.5" fill="url(#g)" opacity="0.75"/>
  <!-- producers → broker -->
  <line x1="9.2" y1="10.3" x2="12.5" y2="13.2" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
  <line x1="9.2" y1="21.7" x2="12.5" y2="18.8" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
  <!-- broker → consumers -->
  <line x1="19.5" y1="13.2" x2="22.8" y2="10.3" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
  <line x1="19.5" y1="18.8" x2="22.8" y2="21.7" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
</svg>
