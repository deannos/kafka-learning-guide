<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14"/>
      <stop offset="100%" style="stop-color:#0d1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(59,130,246,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="url(#accent)"/>
  <circle cx="112" cy="112" r="10" fill="white" opacity="0.9"/>
  <circle cx="93" cy="97" r="7" fill="white" opacity="0.7"/>
  <circle cx="131" cy="97" r="7" fill="white" opacity="0.7"/>
  <circle cx="93" cy="127" r="7" fill="white" opacity="0.7"/>
  <circle cx="131" cy="127" r="7" fill="white" opacity="0.7"/>
  <line x1="100" y1="101" x2="106" y2="107" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="123" x2="106" y2="117" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="118" y1="107" x2="124" y2="101" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="118" y1="117" x2="124" y2="123" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Site name -->
  <text x="160" y="107" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.3px">KafkaGuide</text>
  <text x="160" y="130" font-family="monospace" font-size="13" fill="#64748b" letter-spacing="0.5px">v1.0 · Developer Portal</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2px">Apache Kafka</text>
  <text x="80" y="340" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="800" letter-spacing="-2px">
    <tspan fill="url(#accent)">Developer</tspan>
    <tspan fill="white"> Guide</tspan>
  </text>

  <!-- Description -->
  <text x="80" y="405" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#94a3b8" letter-spacing="-0.2px">From first principles to production — architecture, security,</text>
  <text x="80" y="435" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#94a3b8" letter-spacing="-0.2px">performance, operations &amp; interview prep.</text>

  <!-- Stats chips -->
  <rect x="80" y="490" width="160" height="44" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="160" y="517" text-anchor="middle" font-family="monospace" font-size="13" fill="#60a5fa" font-weight="600">11 Pages</text>

  <rect x="256" y="490" width="190" height="44" rx="8" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="351" y="517" text-anchor="middle" font-family="monospace" font-size="13" fill="#22d3ee" font-weight="600">60+ Sections</text>

  <rect x="462" y="490" width="200" height="44" rx="8" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="562" y="517" text-anchor="middle" font-family="monospace" font-size="13" fill="#4ade80" font-weight="600">No Build Step</text>

  <!-- Right side decoration — node graph -->
  <circle cx="980" cy="200" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="1060" cy="160" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="1100" cy="240" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="1060" cy="320" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="980" cy="360" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="860" cy="280" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="900" cy="160" r="4" fill="#8b5cf6" opacity="0.6"/>
  <line x1="980" y1="200" x2="1060" y2="160" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <line x1="980" y1="200" x2="1100" y2="240" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <line x1="980" y1="200" x2="1060" y2="320" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <line x1="980" y1="200" x2="980" y2="360" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <line x1="980" y1="200" x2="860" y2="280" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  <line x1="980" y1="200" x2="900" y2="160" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>

  <!-- URL -->
  <text x="1120" y="600" text-anchor="end" font-family="monospace" font-size="14" fill="#334155">deannos.github.io/kafka-learning-guide</text>
</svg>
